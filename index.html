<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teulera Tennis · Comunicación interna</title>
<style>
  :root{
    --green:#1A5D1F;
    --green-dark:#0f3d13;
    --green-mid:#2f7a34;
    --green-teal:#0d8a63;
    --green-light:#e7f3e8;
    --green-pale:#f2f9f2;
    --white:#ffffff;
    --ink:#22301f;
    --ink-soft:#6b7d6c;
    --ink-faint:#8fa190;
    --border:#dfeadf;
    --amber:#b8790f;
    --amber-bg:#fdf1dd;
    --amber-border:#f3ddb0;
    --coral:#c1573f;
    --coral-bg:#fbeae6;
    --shadow:0 4px 18px rgba(26,93,31,.08);
    --shadow-lg:0 18px 40px rgba(15,40,17,.16);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:12px;
    --area-tenis:#1A5D1F;
    --area-fisico:#b45309;
    --area-nutricion:#0d7d72;
    --area-psicologo:#6d28d9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#eef5ee;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--green-light);}
  h1,h2,h3{margin:0;color:var(--green-dark);}

  /* ---------- Auth shell (landing / setup) ---------- */
  .auth-shell{
    flex:1;display:flex;align-items:center;justify-content:center;padding:36px 18px;
    background:radial-gradient(circle at 28% 18%, #eaf7ea 0%, #cfe9cf 45%, #b8dfbb 100%);
  }
  .auth-card{
    background:#fff;border-radius:28px;box-shadow:var(--shadow-lg);
    padding:0 0 32px;width:100%;max-width:430px;text-align:center;
    position:relative;overflow:hidden;
  }
  .auth-card-body{padding:26px 34px 0;}
  .auth-logo{width:100%;display:block;margin-bottom:0;}
  .auth-sub{color:var(--ink-soft);font-size:14.5px;margin:20px 0 30px;}
  .back-link{
    position:absolute;top:18px;left:20px;background:rgba(15,40,17,.35);border:none;color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;padding:6px 12px;
    border-radius:999px;backdrop-filter:blur(2px);
  }
  .back-link:hover{background:rgba(15,40,17,.55);}

  .grad-btn{
    width:100%;border:none;border-radius:999px;color:#fff;font-weight:700;font-size:15.5px;
    padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:12px;box-shadow:0 8px 18px rgba(15,40,17,.18);transition:transform .12s ease;
  }
  .grad-btn:hover{transform:translateY(-1px);}
  .grad-btn.coach{background:linear-gradient(135deg,#2f7a34,#0f3d13);}
  .grad-btn.player{background:linear-gradient(135deg,#12a37e,#1A5D1F);}

  .opt-list{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:4px;}
  .opt-item{
    display:flex;align-items:center;gap:12px;background:var(--green-pale);border:1.5px solid transparent;
    border-radius:16px;padding:15px 16px;font-weight:700;font-size:15px;color:var(--green-dark);
  }
  .opt-item:hover{border-color:var(--green);background:var(--green-light);}
  .opt-item .oi-emoji{font-size:19px;}

  .demo-box{
    margin-top:26px;background:var(--green-pale);border:1px solid var(--border);
    border-radius:16px;padding:16px;text-align:left;
  }
  .demo-box p{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .chip-row{display:flex;gap:7px;flex-wrap:wrap;}
  .demo-chip{
    background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:7px 13px;
    font-size:12px;font-weight:600;color:var(--green-dark);
  }
  .demo-chip:hover{border-color:var(--green);background:var(--green-light);}

  .field{margin-bottom:6px;text-align:left;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px;}
  .field input[type=text], .field input[type=password]{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
    font-size:15px;background:#fbfdfb;
  }
  .field input:focus{outline:2px solid var(--green);outline-offset:1px;}
  .setup-note{background:var(--green-pale);border-radius:14px;padding:12px 14px;font-size:12.5px;
    color:var(--ink-soft);text-align:left;margin:14px 0 20px;line-height:1.5;}
  .btn-primary{
    width:100%;background:linear-gradient(135deg,#2f7a34,#0f3d13);color:#fff;border:none;border-radius:999px;
    padding:15px;font-size:15.5px;font-weight:700;margin-top:6px;box-shadow:0 8px 18px rgba(15,40,17,.18);
  }
  .btn-primary:hover{filter:brightness(1.05);}

  /* ---------- Topbar ---------- */
  .topbar{
    background:#fff;border-bottom:1px solid var(--border);padding:12px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:30;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:36px;border-radius:7px;}
  .brand b{font-size:16px;color:var(--green-dark);letter-spacing:.2px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pill-btn{
    background:var(--green-pale);border:1.5px solid var(--border);border-radius:999px;
    padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--green-dark);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .pill-btn:hover{border-color:var(--green);background:var(--green-light);}
  .pill-btn.ghost{background:#fff;}
  .pill-btn.who{background:var(--green-light);color:var(--green-dark);}

  /* ---------- Select player screen ---------- */
  .page{flex:1;max-width:980px;margin:0 auto;width:100%;padding:30px 22px 60px;}
  .page-head{margin-bottom:22px;}
  .page-head h2{font-size:24px;margin-bottom:6px;}
  .page-head p{color:var(--ink-soft);font-size:14px;margin:0;}
  .add-btn{
    background:linear-gradient(135deg,#2f7a34,#0f3d13);color:#fff;border:none;border-radius:999px;
    padding:12px 20px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;
    margin:16px 0 26px;box-shadow:0 8px 16px rgba(15,40,17,.16);
  }
  .add-player-form{
    background:var(--green-pale);border:1.5px solid var(--border);border-radius:18px;
    padding:18px 20px;margin-bottom:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;
  }
  .add-player-form .field{flex:1;min-width:160px;margin-bottom:0;}
  .player-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .player-card{
    background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;
    box-shadow:var(--shadow);position:relative;text-align:left;
  }
  .player-card button.pc-body{background:none;border:none;padding:0;width:100%;text-align:left;}
  .pc-name{font-size:16.5px;font-weight:800;color:var(--ink);margin-bottom:4px;}
  .pc-sub{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .pc-resp{
    background:var(--green-pale);border-radius:11px;padding:10px 12px;font-size:11.5px;
    display:flex;flex-wrap:wrap;gap:6px 14px;line-height:1.5;
  }
  .pc-resp span.mine{color:var(--green-dark);font-weight:800;}
  .pc-resp span.none{color:var(--ink-faint);}

  /* ---------- Dashboard header ---------- */
  .dash-header{
    background:linear-gradient(120deg,#2c7a31,#0f3d13);color:#fff;border-radius:20px;
    padding:20px 24px;margin:22px auto 0;max-width:980px;display:flex;align-items:center;
    justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .dash-header .dh-info{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;}
  .dash-header .dh-info b{font-weight:800;}
  .dash-header .dh-info .lbl{opacity:.78;font-weight:600;margin-right:5px;}
  .pdf-btn{
    background:#fff;color:var(--green-dark);border:none;border-radius:999px;padding:10px 16px;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:8px;padding:18px 0 0;max-width:980px;margin:0 auto;overflow-x:auto;
  }
  .tab-btn{
    background:#fff;border:1.5px solid var(--border);border-radius:999px;
    padding:10px 18px;font-size:13.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;
    display:flex;align-items:center;gap:7px;
  }
  .tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
  .tab-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;display:inline-block;box-shadow:0 0 0 2px #fff;}
  .tab-btn.active .tab-dot{box-shadow:0 0 0 2px var(--green);}
  .card-dot{width:9px;height:9px;border-radius:50%;background:#ef4444;position:absolute;top:16px;right:16px;box-shadow:0 0 0 2px #fff;}

  /* ---------- Resumen grid ---------- */
  .resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
  .resumen-card{
    background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px 20px;
    box-shadow:var(--shadow);text-align:left;
  }
  .resumen-card button{background:none;border:none;padding:0;text-align:left;width:100%;}
  .rc-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:700;margin-bottom:8px;}
  .rc-title{font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:5px;}
  .rc-date{font-size:12px;color:var(--ink-soft);}
  .rc-empty{color:var(--ink-faint);font-size:13px;}

  /* ---------- Area page ---------- */
  .area-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .area-head h2{font-size:23px;}
  .status-pill{border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
  .status-pill.can{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
  .status-pill.cant{background:var(--green-pale);color:var(--ink-soft);border:1px solid var(--border);}
  .area-desc{color:var(--ink-soft);font-size:13.5px;margin:6px 0 20px;}

  .add-box{
    background:var(--green-pale);border:1.5px solid var(--border);border-radius:18px;
    padding:20px 22px;margin-bottom:22px;
  }
  .add-box h4{margin:0 0 14px;font-size:14.5px;color:var(--green-dark);}
  .add-box textarea{
    width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--border);
    font-size:14px;resize:vertical;min-height:80px;background:#fff;
  }
  .add-box textarea:focus, .filter-row input:focus{outline:2px solid var(--green);outline-offset:1px;}
  .save-btn{
    background:linear-gradient(135deg,#2f7a34,#0f3d13);color:#fff;border:none;border-radius:999px;
    padding:11px 22px;font-size:13.5px;font-weight:700;margin-top:12px;
  }

  .filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filter-row input{
    border:1.5px solid var(--border);border-radius:11px;padding:10px 13px;font-size:13px;background:#fbfdfb;
  }
  .filter-row input[type=text]{flex:1;min-width:180px;}

  .entry-list{display:flex;flex-direction:column;gap:12px;}
  .entry-card{
    background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);
  }
  .entry-date{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .entry-title{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:6px;}
  .entry-text{font-size:13.6px;line-height:1.55;color:#33402f;white-space:pre-wrap;margin-bottom:10px;}
  .entry-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .author-tag{font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .del-btn{
    background:#fff;border:1.5px solid var(--coral);color:var(--coral);border-radius:999px;
    padding:6px 14px;font-size:11.5px;font-weight:700;
  }
  .del-btn:hover{background:var(--coral-bg);}
  .empty-note{color:var(--ink-faint);font-size:13.5px;text-align:center;padding:34px 10px;}

  @media (max-width:720px){
    .player-grid{grid-template-columns:1fr;}
    .resumen-grid{grid-template-columns:1fr;}
    .dash-header{border-radius:0;margin-top:0;}
    .page{padding:20px 14px 50px;}
    .tabs{gap:5px;padding:14px 0 0;overflow-x:visible;flex-wrap:nowrap;justify-content:space-between;}
    .tab-btn{padding:8px 4px;font-size:10.5px;gap:3px;flex:1;justify-content:center;white-space:nowrap;}
  }
  @media (max-width:400px){
    .tab-btn{font-size:9.5px;padding:7px 2px;}
  }

  /* ---------- Attachments ---------- */
  .file-field{margin-top:12px;}
  .file-field input[type=file]{
    width:100%;padding:9px 10px;border-radius:12px;border:1.5px dashed var(--border);
    background:#fff;font-size:12.5px;
  }
  .attach-pill{
    background:var(--green-pale);border:1px solid var(--border);color:var(--green-dark);
    border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:700;display:inline-flex;
    align-items:center;gap:6px;
  }
  .attach-pill:hover{background:var(--green-light);border-color:var(--green);}

  /* ---------- Weekly summary ---------- */
  .weekly-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .weekly-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
  .wk-stat{
    background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px;min-width:120px;
    box-shadow:var(--shadow);
  }
  .wk-stat .n{font-size:22px;font-weight:800;color:var(--green-dark);}
  .wk-stat .l{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .weekly-section{margin-bottom:22px;}
  .weekly-section h4{font-size:14.5px;color:var(--green-dark);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .weekly-empty{color:var(--ink-faint);font-size:13px;padding:4px 0 0;}

  @media print{
    body *{visibility:hidden;}
    .printable, .printable *{visibility:visible;}
    .printable{position:absolute;left:0;top:0;width:100%;padding:20px;}
    .printable .no-print{display:none !important;}
  }
</style>
</head>

function initials(name){
  return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"});
}

/* ---------------- SYNC CON EL SERVIDOR ---------------- */
let lastRev = 0;
let syncFailed = false;

function applyServerState(data){
  if(data.coaches) coaches = data.coaches;
  if(data.players) players = data.players;
  if(data.posts) posts = data.posts;
  if(typeof data.rev === "number") lastRev = data.rev;
}

async function apiPost(path, body){
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({error:"error"}));
    throw new Error(err.error || "error");
  }
  const data = await res.json();
  applyServerState(data);
  return data;
}

async function bootstrap(){
  try{
    const res = await fetch("/api/state");
    if(res.ok){
      const data = await res.json();
      applyServerState(data);
      syncFailed = false;
    }
  }catch(e){
    syncFailed = true; // sin conexión al servidor: seguimos con los datos de ejemplo en memoria
  }
  render();
  startPolling();
}

function startPolling(){
  setInterval(async ()=>{
    try{
      const res = await fetch("/api/state");
      if(!res.ok) return;
      const data = await res.json();
      syncFailed = false;
      if(data.rev !== lastRev){
        applyServerState(data);
        const activeTag = document.activeElement && document.activeElement.tagName;
        const typing = activeTag === "INPUT" || activeTag === "TEXTAREA";
        if(!typing) render();
      }
    }catch(e){
      syncFailed = true;
    }
  }, 6000);
}

let state = {

  pendingArea: null,

  activeTab: "resumen",

  showAddPlayer: false,
  search: "",
  loginError: null,
  seen: new Set(),   // "playerId:area" combos already opened this session
};

function areaHasNew(playerId, area){
  const key = playerId+":"+area;
  if(state.seen.has(key)) return false;
  return posts.some(m=>m.playerId===playerId && m.area===area);
}
function playerHasNew(playerId){
  return AREA_KEYS.some(k=>areaHasNew(playerId, k));
}
function markSeen(playerId, area){
  state.seen.add(playerId+":"+area);
}

function personName(id){ const c = coaches.find(x=>x.id===id); return c ? c.name : "—"; }
function isResponsable(coachId, playerId, area){
  const p = players.find(x=>x.id===playerId);
  if(!p) return false;
  const r = p.responsables[area];
  if(Array.isArray(r)) return r.includes(coachId);
  return r === coachId;
}
function respIds(player, area){
  const r = player.responsables[area];
  if(!r) return [];
  return Array.isArray(r) ? r : [r];
}
function respLabel(player, area){
  const ids = respIds(player, area);
  if(ids.length===0) return null;
  const names = ids.map(personName);
  if(names.length===1) return names[0];
  return names.slice(0,-1).join(", ") + " y " + names[names.length-1];
}
function canSeeCredentials(u){
  return !!u && u.id === "c7"; // solo Lluis, aunque haya varios directores
}
function canWrite(area, playerId){
  const u = state.currentUser;
  if(!u || u.role!=="entrenador") return false;
  if(u.director) return true;
  if(u.area !== area) return false;
  if(AREAS[area].sharedWrite) return true;
  return isResponsable(u.id, playerId, area);
}

}

    ${AREA_KEYS.map(k=>{

      return `
      <div class="weekly-section">

            </div>`).join("")}
        </div>`}

    }).join("")}

}

const HELV_WIDTHS = {32:278,33:278,34:355,35:556,36:556,37:889,38:667,39:191,40:333,41:333,42:389,43:584,44:278,45:333,46:278,47:278,48:556,49:556,50:556,51:556,52:556,53:556,54:556,55:556,56:556,57:556,58:278,59:278,60:584,61:584,62:584,63:556,64:1015,65:667,66:667,67:722,68:722,69:667,70:611,71:778,72:722,73:278,74:500,75:667,76:556,77:833,78:722,79:778,80:667,81:778,82:722,83:667,84:611,85:722,86:667,87:944,88:667,89:667,90:611,91:278,92:278,93:278,94:469,95:556,96:333,97:556,98:556,99:500,100:556,101:556,102:278,103:556,104:556,105:222,106:222,107:500,108:222,109:833,110:556,111:556,112:556,113:556,114:333,115:500,116:278,117:556,118:500,119:722,120:500,121:500,122:500,123:334,124:260,125:334,126:584,161:278,191:556,193:667,201:667,205:278,209:722,211:778,218:722,220:722,225:556,233:556,237:222,241:556,243:556,250:556,252:556};
function toLatin1(s){ return String(s==null?"":s).split("").filter(ch=>ch.charCodeAt(0)<=255).join(""); }
function pdfEscape(s){ return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
function charWidth(code, bold){ let w = HELV_WIDTHS[code] || 556; return bold ? Math.round(w*1.06) : w; }
function measureText(str, size, bold){ let w=0; for(let i=0;i<str.length;i++) w += charWidth(str.charCodeAt(i), bold); return w*size/1000; }
function wrapParagraph(str, maxWidth, size, bold){
  const words = str.split(/\s+/).filter(Boolean);
  if(words.length===0) return [""];
  const lines=[]; let cur="";
  words.forEach(w=>{
    const test = cur ? cur+" "+w : w;
    if(!cur || measureText(test,size,bold) <= maxWidth){ cur = test; }
    else { lines.push(cur); cur = w; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function wrapText(str, maxWidth, size, bold){
  const clean = toLatin1(str||"");
  const paras = clean.split(/\n/);
  let out=[];
  paras.forEach(p=>{ out = out.concat(wrapParagraph(p, maxWidth, size, bold)); });
  return out.length ? out : [""];
}
function MiniPdf(){
  this.pageW = 595.28;
  this.pageH = 841.89;
  this.pages = [];
  this._newPage();
}
MiniPdf.prototype._newPage=function(){ this.curPage = { ops: [] }; this.pages.push(this.curPage); };
MiniPdf.prototype.addPage=function(){ this._newPage(); };
MiniPdf.prototype.line=function(x1,y1,x2,y2,r,g,b,w){
  this.curPage.ops.push(`${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} RG`);
  this.curPage.ops.push(`${w||1} w`);
  this.curPage.ops.push(`${x1.toFixed(2)} ${(this.pageH-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.pageH-y2).toFixed(2)} l S`);
};
MiniPdf.prototype.text=function(x,y,str,font,size,color){
  const clean = toLatin1(str||"");
  const esc = pdfEscape(clean);
  const fontCode = font==="bold" ? "F2" : font==="italic" ? "F3" : "F1";
  const c = color || [30,30,30];
  this.curPage.ops.push(`${(c[0]/255).toFixed(3)} ${(c[1]/255).toFixed(3)} ${(c[2]/255).toFixed(3)} rg`);
  this.curPage.ops.push(`BT /${fontCode} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${(this.pageH-y).toFixed(2)} Tm (${esc}) Tj ET`);
};
MiniPdf.prototype.build=function(){
  const N = this.pages.length;
  const pageObjNums=[], contentObjNums=[];
  for(let i=0;i<N;i++){ pageObjNums.push(6+2*i); contentObjNums.push(7+2*i); }
  const objects = [];
  const kids = pageObjNums.map(n=>`${n} 0 R`).join(" ");
  objects[1] = `1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`;
  objects[2] = `2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${N} /MediaBox [0 0 ${this.pageW.toFixed(2)} ${this.pageH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> >>\nendobj\n`;
  objects[3] = `3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n`;
  objects[4] = `4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n`;
  objects[5] = `5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>\nendobj\n`;
  this.pages.forEach((page,i)=>{
    const pObjNum = pageObjNums[i], cObjNum = contentObjNums[i];
    objects[pObjNum] = `${pObjNum} 0 obj\n<< /Type /Page /Parent 2 0 R /Contents ${cObjNum} 0 R >>\nendobj\n`;
    const stream = page.ops.join("\n");
    objects[cObjNum] = `${cObjNum} 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}\nendstream\nendobj\n`;
  });
  const maxObjNum = 6 + 2*N - 1;
  let out = "%PDF-1.4\n";
  const offsets = [0];
  for(let n=1;n<=maxObjNum;n++){ offsets[n] = out.length; out += objects[n]; }
  const xrefStart = out.length;
  out += `xref\n0 ${maxObjNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxObjNum;n++){ out += String(offsets[n]).padStart(10,"0") + " 00000 n \n"; }
  out += `trailer\n<< /Size ${maxObjNum+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return out;
};
MiniPdf.prototype.save=function(filename){
  const pdfStr = this.build();
  const bytes = new Uint8Array(pdfStr.length);
  for(let i=0;i<pdfStr.length;i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  const blob = new Blob([bytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
};

function generateWeeklyPdf(playerId){
  const player = players.find(p=>p.id===playerId);
  if(!player) return;
  const since = new Date();
  since.setDate(since.getDate()-7);
  const weekPosts = posts.filter(m=>m.playerId===player.id && new Date(m.date) >= since);
  const total = weekPosts.length;

  const doc = new MiniPdf();
  const marginL = 48, marginR = 48;
  const contentW = doc.pageW - marginL - marginR;
  let y = 56;
  const green = [26,93,31];
  const inkSoft = [110,110,110];
  const ink = [30,30,30];

  function ensureSpace(h){
    if(y + h > doc.pageH - 48){ doc.addPage(); y = 56; }
  }

  // Header
  doc.text(marginL, y, "Teulera Tennis - Resumen semanal", "bold", 18, green);
  y += 26;
  doc.text(marginL, y, player.name, "bold", 14, ink);
  y += 18;
  doc.text(marginL, y, `Del ${formatDate(since.toISOString())} a ${formatDate(new Date().toISOString())} - ${player.categoria||""}`, "normal", 10.5, inkSoft);
  y += 16;
  doc.line(marginL, y, doc.pageW - marginR, y, green[0], green[1], green[2], 1);
  y += 22;

  // Stats line
  const statParts = [`${total} actualizaciones esta semana`].concat(
    AREA_KEYS.map(k=>{
      const c = weekPosts.filter(m=>m.area===k).length;
      return `${AREAS[k].label}: ${c}`;
    })
  );
  const statsLines = wrapText(statParts.join("   -   "), contentW, 11, true);
  statsLines.forEach(line=>{
    ensureSpace(14);
    doc.text(marginL, y, line, "bold", 11, ink);
    y += 14;
  });
  y += 12;

  // Sections per area
  AREA_KEYS.forEach(k=>{
    const items = weekPosts.filter(m=>m.area===k).sort((a,b)=>new Date(b.date)-new Date(a.date));

    ensureSpace(24);
    doc.text(marginL, y, AREAS[k].label, "bold", 13, green);
    y += 18;

    if(items.length===0){
      ensureSpace(16);
      doc.text(marginL, y, "Sin actualizaciones esta semana.", "italic", 10.5, inkSoft);
      y += 20;
    } else {
      items.forEach(m=>{
        ensureSpace(28);
        doc.text(marginL, y, `${formatDate(m.date)} - ${personName(m.authorId)}`, "normal", 9.5, inkSoft);
        y += 14;

        const titleLines = wrapText(m.title||"", contentW, 11.5, true);
        ensureSpace(titleLines.length*14);
        titleLines.forEach(line=>{ doc.text(marginL, y, line, "bold", 11.5, ink); y += 14; });
        y += 2;

        const bodyLines = wrapText(m.text||"", contentW, 10.5, false);
        bodyLines.forEach(line=>{
          ensureSpace(13);
          doc.text(marginL, y, line, "normal", 10.5, ink);
          y += 13;
        });
        y += 6;

        if(m.attachment){
          ensureSpace(14);
          doc.text(marginL, y, `Adjunto: ${m.attachment.name}`, "italic", 9.5, inkSoft);
          y += 16;
        }
        y += 6;
      });
    }
    y += 8;
  });

  const dateStamp = new Date().toISOString().slice(0,10);
  const safeName = player.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  doc.save(`resumen-semanal-${safeName}-${dateStamp}.pdf`);
}

function latestPost(playerId, area){
  const list = posts.filter(m=>m.playerId===playerId && m.area===area).sort((a,b)=>new Date(b.date)-new Date(a.date));
  return list[0] || null;
}

function renderResumen(player){
  return `
  <div class="page-head" style="margin-top:6px">
    <h2>Resumen general</h2>
    <p>Vista de conjunto — visible para todo el equipo técnico y ${player.name.split(" ")[0]}.</p>
  </div>
  <div class="resumen-grid">
    ${AREA_KEYS.map(k=>{
      const m = latestPost(player.id, k);
      return `
      <div class="resumen-card">
        <button data-action="set-tab" data-tab="${k}">
          <div class="rc-label">${AREAS[k].emoji} Última actualización · ${AREAS[k].label}</div>
          ${m ? `<div class="rc-title">${escapeHtml(m.title)}</div><div class="rc-date">${formatDate(m.date)}</div>`
              : `<div class="rc-empty">Todavía no hay ninguna actualización.</div>`}
        </button>
      </div>`;
    }).join("")}
  </div>`;
}

function renderAreaPage(player, area, u){
  const allowed = canWrite(area, player.id);
  const respLbl = respLabel(player, area);
  let list = posts.filter(m=>m.playerId===player.id && m.area===area);
  const q = (state.search||"").toLowerCase();
  if(q) list = list.filter(m=> m.title.toLowerCase().includes(q) || m.text.toLowerCase().includes(q));
  list = list.sort((a,b)=>new Date(b.date)-new Date(a.date));

  return `
  <div class="area-head">
    <h2>${AREAS[area].label}</h2>
    ${allowed
      ? `<span class="status-pill can">✏️ Puedes escribir aquí</span>`
      : `<span class="status-pill cant">👁️ Solo puedes ver</span>`}
  </div>
  <p class="area-desc">${AREAS[area].desc}${(AREAS[area].sharedWrite && !allowed) ? ` Todos los entrenadores de ${AREAS[area].label.toLowerCase()} del club pueden escribir aquí.` : ""}${(!AREAS[area].sharedWrite && !allowed && respLbl) ? ` Responsable actual: <b>${respLbl}</b>.` : ""}${(!AREAS[area].sharedWrite && !allowed && !respLbl) ? ` Todavía no hay ningún responsable de ${AREAS[area].label.toLowerCase()} asignado a ${player.name}.` : ""}</p>

  ${allowed ? `
  <div class="add-box">
    <h4>${area==="psicologo" ? "Añadir resumen de sesión" : "Añadir actualización"}</h4>
    <form data-form="post" data-player="${player.id}" data-area="${area}">
      <div class="field"><label>Título</label><input type="text" name="title" placeholder="${area==='psicologo' ? 'Ej. Sesión de hoy' : 'Título breve'}" required></div>
      <div class="field" style="margin-top:12px"><label>Detalle</label><textarea name="text" placeholder="${area==='psicologo' ? '¿Cómo ha ido la sesión con el jugador?' : 'Descripción…'}" required></textarea></div>
      ${AREAS[area].pdf ? `
      <div class="field file-field"><label>Adjuntar PDF (opcional)</label><input type="file" name="attachment" accept="application/pdf"></div>` : ``}
      <button class="save-btn" type="submit">Guardar</button>
    </form>
  </div>` : ``}

  <div class="filter-row">
    <input type="text" placeholder="Buscar en las actualizaciones…" data-input="search" value="${state.search||''}">
  </div>

  <div class="entry-list">
    ${list.map(m=>`
      <div class="entry-card">
        <div class="entry-date">${formatDate(m.date)}</div>
        <div class="entry-title">${escapeHtml(m.title)}</div>
        <div class="entry-text">${escapeHtml(m.text)}</div>
        ${m.attachment ? `<div style="margin-bottom:10px"><button class="attach-pill" data-action="open-attachment" data-id="${m.id}">📎 ${escapeHtml(m.attachment.name)}</button></div>` : ``}
        <div class="entry-foot">
          <span class="author-tag">${personName(m.authorId)}</span>
          ${allowed ? `<button class="del-btn" data-action="delete-post" data-id="${m.id}">Eliminar</button>` : ``}
        </div>
      </div>`).join("")}
    ${list.length===0 ? `<div class="empty-note">Todavía no hay actualizaciones aquí.</div>` : ``}
  </div>`;
}

function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- EVENTS ---------------- */
function bindEvents(){
  app.querySelectorAll("[data-action='pick-role']").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.pendingRole = el.dataset.role;
      state.view = (el.dataset.role==="entrenador") ? "setup-area" : "setup-profile";
      render();
    });
  });

  app.querySelectorAll("[data-action='pick-area']").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.pendingArea = el.dataset.area;
      state.view = "setup-profile";
      render();
    });
  });

  const loginForm = app.querySelector("[data-form='login']");
  if(loginForm){
    loginForm.addEventListener("submit", (e)=>{
      e.preventDefault();
      const fd = new FormData(loginForm);
      const uname = (fd.get("username")||"").toString().trim().toLowerCase();
      const pass = (fd.get("password")||"").toString();
      const c = coaches.find(x=> (x.username||"").toLowerCase()===uname && x.password===pass);
      const p = !c ? players.find(x=> (x.username||"").toLowerCase()===uname && x.password===pass) : null;
      if(c){
        state.currentUser = { id:c.id, name:c.name, role:"entrenador", area:c.area, director:!!c.director };
        state.selectedPlayerId = null;
        state.activeTab = "resumen";
        state.loginError = null;
        state.view = "select-player";
      }else if(p){
        state.currentUser = { id:p.id, name:p.name, role:"jugador" };
        state.selectedPlayerId = p.id;
        state.activeTab = "resumen";
        state.loginError = null;
        state.view = "dashboard";
      }else{
        state.loginError = "Usuario o contraseña incorrectos.";
      }
      render();
    });
  }

  const backLanding = app.querySelector("[data-action='back-landing']");
  if(backLanding) backLanding.addEventListener("click", ()=>{ state.view="landing"; render(); });
  const backArea = app.querySelector("[data-action='back-setup-area']");
  if(backArea) backArea.addEventListener("click", ()=>{ state.view="setup-area"; render(); });

  const profileForm = app.querySelector("[data-form='profile']");
  if(profileForm){
    profileForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd = new FormData(profileForm);
      const name = (fd.get("name")||"").toString().trim();
      if(!name) return;
      if(state.pendingRole === "entrenador"){
        const area = state.pendingArea || AREA_KEYS[0];
        try{
          const data = await apiPost("/api/coaches", { name, area });
          const id = data.created.id;
          state.currentUser = { id, name, role:"entrenador", area };
          state.view = "select-player";
        }catch(err){
          const id = newId("c");
          coaches.push({ id, name, role:"entrenador", area });
          state.currentUser = { id, name, role:"entrenador", area };
          state.view = "select-player";
        }
      }else{
        try{
          const data = await apiPost("/api/players", { name, categoria:"" });
          const id = data.created.id;
          state.currentUser = { id, name, role:"jugador" };
          state.selectedPlayerId = id;
          state.view = "dashboard";
        }catch(err){
          const id = newId("p");
          players.push({ id, name, categoria:"", responsables:{ tenis:null, fisico:null, nutricion:"c9", psicologo:"c10" } });
          state.currentUser = { id, name, role:"jugador" };
          state.selectedPlayerId = id;
          state.view = "dashboard";
        }
      }
      state.activeTab = "resumen";
      render();
    });
  }

  const toggleAdd = app.querySelector("[data-action='toggle-add-player']");
  if(toggleAdd) toggleAdd.addEventListener("click", ()=>{ state.showAddPlayer = !state.showAddPlayer; render(); });

  const addPlayerForm = app.querySelector("[data-form='add-player']");
  if(addPlayerForm){
    addPlayerForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd = new FormData(addPlayerForm);
      const name = (fd.get("name")||"").toString().trim();
      if(!name) return;
      const categoria = (fd.get("categoria")||"").toString().trim();
      try{
        await apiPost("/api/players", { name, categoria });
      }catch(err){
        const id = newId("p");
        players.push({ id, name, categoria, responsables:{ tenis:null, fisico:null, nutricion:"c9", psicologo:"c10" } });
      }
      state.showAddPlayer = false;
      render();
    });
  }

  app.querySelectorAll("[data-action='select-player']").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.selectedPlayerId = el.dataset.id;
      state.activeTab = "resumen";
      state.search = "";
      state.view = "dashboard";
      render();
    });
  });

  const goSelect = app.querySelectorAll("[data-action='go-select-player']");
  goSelect.forEach(el=> el.addEventListener("click", ()=>{ state.view="select-player"; state.search=""; render(); }));

  const goCreds = app.querySelectorAll("[data-action='go-credentials']");
  goCreds.forEach(el=> el.addEventListener("click", ()=>{ state.view="credentials"; render(); }));

  const goHome = app.querySelectorAll("[data-action='go-home']");
  goHome.forEach(el=> el.addEventListener("click", ()=>{
    const u = state.currentUser;
    if(!u){ state.view="landing"; render(); return; }
    if(u.role==="jugador"){
      state.activeTab = "resumen";
      state.view = "dashboard";
    }else if(state.view==="dashboard"){
      state.activeTab = "resumen";
    }else{
      state.view = "select-player";
      state.search = "";
    }
    render();
  }));

  const logoutBtn = app.querySelector("[data-action='logout']");
  if(logoutBtn) logoutBtn.addEventListener("click", ()=>{
    state = { view:"landing", pendingRole:null, pendingArea:null, currentUser:null, activeTab:"resumen", selectedPlayerId:null, showAddPlayer:false, search:"", loginError:null, seen:new Set() };
    render();
  });

  app.querySelectorAll("[data-action='set-tab']").forEach(el=>{
    el.addEventListener("click", ()=>{ state.activeTab = el.dataset.tab; state.search=""; render(); });
  });

  app.querySelectorAll("[data-action='print']").forEach(el=>{
    el.addEventListener("click", ()=> window.print());
  });

  app.querySelectorAll("[data-action='download-weekly-pdf']").forEach(el=>{
    el.addEventListener("click", ()=> generateWeeklyPdf(el.dataset.playerId));
  });

  const showWeekly = app.querySelector("[data-action='show-weekly']");
  if(showWeekly) showWeekly.addEventListener("click", ()=>{ state.activeTab="semanal"; render(); });

  app.querySelectorAll("[data-action='open-attachment']").forEach(el=>{
    el.addEventListener("click", ()=>{
      const m = posts.find(p=>p.id===el.dataset.id);
      if(m && m.attachment){
        const w = window.open();
        if(w){ w.document.write(`<iframe src="${m.attachment.dataUrl}" style="border:none;width:100%;height:100vh"></iframe>`); }
      }
    });
  });

  const searchInput = app.querySelector("[data-input='search']");
  if(searchInput){
    searchInput.addEventListener("input", (e)=>{
      state.search = e.target.value;
      render();
      const again = app.querySelector("[data-input='search']");
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
  }

  const postForm = app.querySelector("[data-form='post']");
  if(postForm){
    postForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd = new FormData(postForm);
      const title = (fd.get("title")||"").toString().trim();
      const text = (fd.get("text")||"").toString().trim();
      if(!title || !text) return;
      const file = fd.get("attachment");
      let attachment = null;
      if(file && file.size > 0){
        attachment = await new Promise((resolve)=>{
          const reader = new FileReader();
          reader.onload = ()=> resolve({ name:file.name, dataUrl: reader.result });
          reader.onerror = ()=> resolve(null);
          reader.readAsDataURL(file);
        });
      }
      const playerId = postForm.dataset.player, area = postForm.dataset.area, authorId = state.currentUser.id;
      try{
        await apiPost("/api/posts", { playerId, area, authorId, title, text, attachment });
      }catch(err){
        posts.push({ id:newId("m"), playerId, area, authorId, date:new Date().toISOString(), title, text, attachment });
      }
      render();
    });
  }

  app.querySelectorAll("[data-action='delete-post']").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const id = el.dataset.id;
      try{
        await apiPost("/api/posts/delete", { id });
      }catch(err){
        posts = posts.filter(m=>m.id!==id);
      }
      render();
    });
  });
}

bootstrap();
</script>
